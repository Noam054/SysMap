# Local development only (outside the air-gap)
services:
  db:
    image: postgres:16.4
    environment:
      POSTGRES_USER: sysmap
      POSTGRES_PASSWORD: sysmap
      POSTGRES_DB: sysmap
    ports: ["5432:5432"]
    volumes: ["dbdata:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://sysmap:sysmap@db:5432/sysmap
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  dbdata:

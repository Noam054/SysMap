<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SysMap</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="shell">
    <!-- Side panel with the tabs. On wide screens it can shrink to icons; on phones it slides in. -->
    <aside class="sidebar" id="sidebar" aria-label="Main">
      <div class="sidebar-head">
        <a class="brand" href="#/">
          <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="8.5" y="14" width="7" height="7" rx="2"/><path d="M6.5 10v2h11v-2M12 12v2" fill="none" stroke-width="1.6"/></svg>
          <span class="label">SysMap</span>
        </a>
        <button type="button" class="icon-btn collapse-btn" id="collapse" aria-label="Collapse the side panel" title="Collapse">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
      </div>
      <nav>
        <a href="#/" data-nav="home" title="Questionnaires">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
          <span class="label">Questionnaires</span>
        </a>
        <a href="#/submissions" data-nav="submissions" title="Submissions">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          <span class="label">Submissions</span>
        </a>
        <a href="#/diagram" data-nav="diagram" title="Diagram">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="7" height="6" rx="1.5"/><rect x="14" y="4" width="7" height="6" rx="1.5"/><rect x="8.5" y="15" width="7" height="6" rx="1.5"/><path d="M6.5 10v2.5h11V10M12 12.5V15"/></svg>
          <span class="label">Diagram</span>
        </a>
      </nav>
    </aside>
    <div class="scrim" id="scrim" hidden></div>
    <div class="content">
      <header class="mobile-bar">
        <button type="button" class="icon-btn" id="open-menu" aria-label="Open the menu" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <span class="brand-text">SysMap</span>
      </header>
      <main id="app"></main>
    </div>
  </div>
  <script type="module" src="js/sidebar.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>

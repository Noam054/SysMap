backend:
  image:
    repository: registry.example.internal/sysmap/backend   # set to your internal registry
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

database:
  # Required. Point to your existing Postgres, in my-values.yaml (git-ignored), for example:
  #   url: "postgresql+psycopg://sysmap:<password>@<postgres-host>:5432/sysmap"
  # Do not commit real passwords. The install fails if this is empty or still a placeholder.
  url: ""

{{- $url := required "database.url is required: set it in my-values.yaml (see values.yaml)" .Values.database.url -}}
{{- if or (contains "CHANGE_ME" $url) (contains "<password>" $url) (contains "example.internal" $url) -}}
{{- fail "database.url still contains a placeholder: set the real value in my-values.yaml" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
type: Opaque
stringData:
  DATABASE_URL: {{ $url | quote }}
